<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Bassin Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/fonts.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100svh; display: flex; align-items: center; justify-content: center; background: #ffffff; color: #1d1d1f; font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; line-height: 1.7; padding: 2rem 1.5rem; -webkit-font-smoothing: antialiased; }
.box { max-width: 560px; text-align: center; }
.logo { width: 52px; height: 52px; margin: 0 auto 1.6rem; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase; color: #1a7a6e; margin-bottom: 1rem; }
h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1.05; margin-bottom: 1rem; }
h1 em { font-style: italic; color: #1a7a6e; }
p { color: rgba(29,29,31,0.72); margin-bottom: 2rem; }
.actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 400; text-decoration: none; padding: 0.9rem 1.8rem; border-radius: 8px; border: 1.5px solid #1a7a6e; color: #ffffff; background: #1a7a6e; transition: background 0.3s, border-color 0.3s; }
.btn:hover { background: #1d1d1f; border-color: #1d1d1f; }
.btn.ghost { background: transparent; color: #1d1d1f; border-color: rgba(0,0,0,0.16); }
.btn.ghost:hover { border-color: #1d1d1f; }
a:focus-visible { outline: 2px solid #1a7a6e; outline-offset: 3px; }
</style>
</head>
<body>
<main class="box">
  <svg class="logo" viewBox="0 0 60 60" fill="none" aria-hidden="true">
    <circle cx="30" cy="30" r="29" fill="#2D4A5A"/>
    <path d="M13 30 C17 21, 24 21, 30 30 C36 39, 43 39, 47 30" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </svg>
  <p class="eyebrow">Erreur 404</p>
  <h1>Cette page a pris <em>le large</em></h1>
  <p>L'adresse n'existe pas ou plus. Le reste du site, lui, est bien là.</p>
  <div class="actions">
    <a href="/" class="btn">Retour à l'accueil</a>
    <a href="/configurer.html" class="btn ghost">Configurer mon site</a>
  </div>
</main>
</body>
</html>
