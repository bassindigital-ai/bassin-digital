<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --teal: #2dd4bf;
  --teal-light: #5fe6d5;
  --navy: #0a1628;
  --cream: #f0ece6;
  --teal-deep: #2D4A5A;
  --bg: #ffffff;
  --card-border: rgba(0,0,0,0.08);
}

body {
  background: #ffffff;
  color: #1d1d1f;
  font-family: 'Jost', sans-serif;
  overflow-x: hidden;
  font-weight: 300;
  font-size: 15px;
  line-height: 1.8;
}

a { color: inherit; }

/* ─── NAV ─── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2rem 3rem;
}

.nav-logo-wrap {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  text-decoration: none;
}

.nav-logo-svg { width: 32px; height: 32px; flex-shrink: 0; }

.nav-logo {font-size: 0.68rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(29,29,31,0.5);
  text-decoration: none;
}

.nav-logo span { color: var(--teal); }

.nav-links { display: flex; gap: 2.5rem; }

.nav-link {font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(29,29,31,0.4);
  text-decoration: none;
  transition: color 0.3s;
}

.nav-link.active, .nav-link:hover { color: #1d1d1f; }

.burger {
  display: none;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  z-index: 310;
}

.burger span {display: block;
  height: 1px;
  background: #1d1d1f;
  transition: transform 0.4s ease, width 0.4s ease;
  transform-origin: right;
}

.burger span:first-child { width: 24px; }
.burger span:last-child  { width: 14px; }
.burger.on span:first-child { transform: translateY(3.5px) rotate(45deg); width: 24px; }
.burger.on span:last-child  { transform: translateY(-3.5px) rotate(-45deg); width: 24px; }

.backdrop {
  position: fixed; inset: 0;
  z-index: 250;
  background: rgba(0,0,0,0);
  transition: background 0.5s ease;
  pointer-events: none;
}

.backdrop.on { background: rgba(0,0,0,0.55); pointer-events: all; }

.panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  z-index: 300;
  width: 260px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.6s cubic-bezier(0.76,0,0.24,1);
  pointer-events: none;
}

.panel.on { transform: translateX(0); pointer-events: all; }

.panel-line {
  position: absolute;
  top: 20%; left: 0; bottom: 20%;
  width: 1px;
  background: var(--teal);
  opacity: 0.4;
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.5s ease 0.35s;
  pointer-events: none;
}

.panel.on .panel-line { transform: scaleY(1); }

.panel-head {
  padding: 1.8rem 1.5rem;
  display: flex;
  justify-content: flex-end;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}

.x-btn {
  width: 32px; height: 32px;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.x-btn::before, .x-btn::after {content: '';
  position: absolute;
  width: 16px; height: 1px;
  background: rgba(0,0,0,0.3);
  transition: background 0.3s;
}

.x-btn::before { transform: rotate(45deg); }
.x-btn::after  { transform: rotate(-45deg); }
.x-btn:hover::before, .x-btn:hover::after { background: #1d1d1f; }

.panel-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  position: relative;
  z-index: 2;
}

.panel-nav a {font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(29,29,31,0.4);
  text-decoration: none;
  padding: 0.7rem 0;
  opacity: 0;
  transform: translateX(12px);
  transition: opacity 0.4s ease, transform 0.5s ease, color 0.3s;
}

.panel.on .panel-nav a { opacity: 1; transform: translateX(0); }
.panel-nav a:nth-child(1) { transition-delay: 0.15s; }
.panel-nav a:nth-child(2) { transition-delay: 0.22s; }
.panel-nav a:nth-child(3) { transition-delay: 0.29s; }
.panel-nav a:nth-child(4) { transition-delay: 0.36s; }
.panel-nav a:hover, .panel-nav a.on { color: #1d1d1f; }

nav::before {
  content: '';
  position: absolute;
  inset: 0;
  height: 120px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.85) 0%, transparent 100%);
  pointer-events: none;
  z-index: -1;
}

@media (max-width: 768px) {
  nav { padding: 1.5rem; }
  .nav-links { display: none; }
  .burger { display: flex; }
}

/* ─── TOP BLUR ─── */
.top-blur {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 180px;
  z-index: 190;
  pointer-events: none;
}

.top-blur::before {
  content: '';
  position: absolute;
  inset: 0;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  -webkit-mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 100%);
  mask-image: linear-gradient(to bottom, black 0%, black 40%, transparent 100%);
}

/* ═══════════════════════════════════════
   APPLE-STYLE MARKETING SHOWCASE
   ═══════════════════════════════════════ */

.showcase-container {
  position: relative;
  width: 100%;
}

/* Hero section */
.showcase-hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  background: linear-gradient(135deg, rgba(45,212,191,0.02) 0%, rgba(13,110,253,0.01) 100%);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}

.showcase-hero-content {
  max-width: 900px;
  z-index: 10;
}

.showcase-hero-label {
  font-size: 0.55rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 1.5rem;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards;
}

.showcase-hero-gamme {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2.5rem, 10vw, 5rem);
  line-height: 1.1;
  margin-bottom: 1.2rem;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards 0.1s;
}

.showcase-hero-tagline {font-size: clamp(1rem, 3vw, 1.4rem);
  color: #6e6e73;
  font-weight: 300;
  margin-bottom: 2.5rem;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards 0.2s;
}

.showcase-hero-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 300;
  margin-bottom: 2rem;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards 0.3s;
}

.showcase-hero-price small {font-size: 0.75rem;
  font-family: 'Jost', sans-serif;
  color: #86868b;
}

.showcase-hero-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
  margin-top: 2.5rem;
  padding: 1.2rem 3.5rem;
  background: var(--teal);
  color: #080808;
  border: none;
  border-radius: 50px;
  font-family: 'Jost', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s ease forwards 0.4s;
}

.showcase-hero-btn:hover {
  background: var(--teal-light);
  transform: translateY(-3px);
}

.showcase-hero-btn svg {
  width: 18px;
  height: 18px;
}

.showcase-hero-visual {
  margin-top: 3rem;
  width: 100%;
  max-width: 600px;
  aspect-ratio: 16/10;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.8s ease forwards 0.4s;
}

.showcase-hero-visual svg {
  width: 100%;
  height: 100%;
}

/* Section blocks */
.showcase-section {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  justify-items: center;
  gap: 4rem;
  padding: 6rem 4rem;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}

.showcase-section.alt {
  grid-auto-flow: dense;
}

.showcase-section.alt .showcase-section-visual {
  grid-column: 1;
}

.showcase-section-content {
  max-width: 500px;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.showcase-section.in-view .showcase-section-content {
  opacity: 1;
  transform: translateY(0);
}

.showcase-section-headline {font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  line-height: 1.2;
  margin-bottom: 1.5rem;
  color: #1d1d1f;
}

.showcase-section-paragraph {font-size: 1rem;
  color: #6e6e73;
  line-height: 1.8;
  margin-bottom: 2rem;
}

.showcase-section-visual {
  width: 100%;
  max-width: 450px;
  aspect-ratio: 1/1.2;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.showcase-section.in-view .showcase-section-visual {
  opacity: 1;
  transform: scale(1);
}

.showcase-section-visual svg {
  width: 100%;
  height: 100%;
}

/* Interactive section */
.showcase-interactive {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6rem 2rem;
  text-align: center;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}

.showcase-interactive-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2rem, 5vw, 3rem);
  margin-bottom: 1rem;
}

.showcase-interactive-desc {font-size: 1.1rem;
  color: #6e6e73;
  max-width: 600px;
  margin-bottom: 3rem;
}

.showcase-interactive-buttons {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 3rem;
}

.showcase-interactive-btn {padding: 0.8rem 1.8rem;
  border: 1px solid rgba(0,0,0,0.12);
  background: transparent;
  color: #6e6e73;
  font-family: 'Jost', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.showcase-interactive-btn:hover {
  border-color: var(--teal);
  color: var(--teal);
  background: rgba(45,212,191,0.05);
}

.showcase-interactive-btn.active {border-color: var(--teal);
  background: rgba(45,212,191,0.12);
  color: #1d1d1f;
}

.showcase-interactive-preview {
  width: 100%;
  max-width: 500px;
  aspect-ratio: 4/5;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 20px;
  overflow: hidden;
  background: rgba(0,0,0,0.01);
  display: flex;
  align-items: center;
  justify-content: center;
}

.showcase-interactive-preview svg {
  width: 100%;
  height: 100%;
  padding: 2rem;
}

/* CTA section */
.showcase-cta {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
  background: linear-gradient(135deg, rgba(45,212,191,0.05) 0%, rgba(13,110,253,0.02) 100%);
}

.showcase-cta-headline {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(2rem, 5vw, 3rem);
  margin-bottom: 1.5rem;
}

.showcase-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
  padding: 1.2rem 3.5rem;
  background: var(--teal);
  color: #080808;
  border: none;
  border-radius: 50px;
  font-family: 'Jost', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

.showcase-cta-btn:hover {
  background: var(--teal-light);
  transform: translateY(-3px);
}

.showcase-cta-btn svg {
  width: 18px;
  height: 18px;
}

/* ═══════════════════════════════════════
   APPLE-STYLE CONFIGURATOR
   ═══════════════════════════════════════ */

/* ─── GAMME TABS ─── */
.gamme-tabs-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 7rem 2rem 2rem;
  text-align: center;
}

.gamme-tabs-heading {font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(1.4rem, 3vw, 1.8rem);
  color: #86868b;
  margin-bottom: 1.5rem;
}

.gamme-tabs {
  display: flex;
  justify-content: center;
  gap: 0.8rem;
  flex-wrap: wrap;
}

.gamme-tab {display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  color: #6e6e73;
  padding: 0.9rem 2.2rem;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 50px;
  transition: all 0.3s ease;
  cursor: pointer;
  font-weight: 300;
}

.gamme-tab:hover {border-color: rgba(0,0,0,0.15);
  color: rgba(0,0,0,0.7);
  background: rgba(0,0,0,0.03);
}

.gamme-tab.active {border-color: var(--teal);
  color: #1d1d1f;
  background: rgba(45,212,191,0.08);
  background: rgba(45,212,191,0.1);
  font-weight: 400;
}

/* ─── HERO INTRO ─── */
.config-intro {
  text-align: center;
  max-width: 700px;
  margin: 3rem auto 0;
  padding: 0 2rem;
}

.config-intro-label {
  font-size: 0.55rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 1rem;
}

.config-intro-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(3.5rem, 8vw, 6rem);
  line-height: 1;
  margin-bottom: 0.8rem;
}

.config-intro-tagline {font-size: 1.15rem;
  color: #6e6e73;
  font-weight: 200;
  margin-bottom: 1.5rem;
}

.config-intro-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 300;
}

.config-intro-price small {font-size: 0.75rem;
  font-family: 'Jost', sans-serif;
  color: #86868b;
}

.config-intro-start {
  margin-top: 2.5rem;
}

.config-intro-start .start-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  color: #1d1d1f;
  background: var(--teal);
  border: none;
  padding: 1.1rem 3rem;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
}

.config-intro-start .start-btn:hover {
  background: var(--teal-light);
  transform: translateY(-2px);
}

.config-intro-start .start-btn svg {
  width: 16px; height: 16px;
}

/* ─── SPLIT LAYOUT ─── */
.config-split {
  display: none;
  grid-template-columns: 1fr 1fr;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 100vh;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.config-split.visible {
  display: grid;
  opacity: 1;
  transform: translateY(0);
}

/* LEFT: Sticky visual */
.config-visual {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4rem;
  overflow: hidden;
}

.visual-container {position: relative;
  width: 100%;
  max-width: 480px;
  aspect-ratio: 4/5;
  border-radius: 24px;
  overflow: hidden;
  background: #f5f5f7;
  border: 1px solid rgba(0,0,0,0.08);
}

.visual-scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.6s ease, transform 0.6s ease;
  padding: 2.5rem;
}

.visual-scene.active {
  opacity: 1;
  transform: scale(1);
}

.visual-scene svg {
  width: 100%;
  height: 100%;
  max-width: 320px;
  max-height: 400px;
}

.visual-label {
  position: absolute;
  bottom: 2rem;
  left: 2rem;
  right: 2rem;
  text-align: center;
}

.visual-label-tag {
  font-size: 0.5rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 0.4rem;
}

.visual-label-name {font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 300;
  color: #1d1d1f;
}

/* RIGHT: Options flow */
.config-options {
  padding: 6rem 3rem 8rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ─── STEP ─── */
.config-step {
  position: relative;
  padding: 2.5rem 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  opacity: 0.25;
  pointer-events: none;
  transition: opacity 0.6s ease, transform 0.4s ease;
  transform: translateY(10px);
}

.config-step.unlocked {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}

.config-step.completed {
  opacity: 0.6;
}

.config-step.active {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}

.step-number {display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.12);
  font-size: 0.65rem;
  font-weight: 400;
  color: rgba(0,0,0,0.3);
  margin-bottom: 1.2rem;
  transition: all 0.4s ease;
}

.config-step.active .step-number {
  border-color: var(--teal);
  color: var(--teal);
  background: rgba(45,212,191,0.08);
}

.config-step.completed .step-number {
  border-color: var(--teal);
  background: var(--teal);
  color: #080808;
}

.step-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 1.8rem;
}

.step-continue {display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-family: 'Jost', sans-serif;
  font-weight: 400;
  color: #1d1d1f;
  background: none;
  border: 1px solid rgba(0,0,0,0.12);
  padding: 0.9rem 2rem;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.step-continue:hover {
  border-color: var(--teal);
  color: var(--teal);
}

.step-continue svg {
  width: 14px; height: 14px;
}

.step-skip {font-size: 0.65rem;
  color: rgba(0,0,0,0.3);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.3s;
  text-decoration: underline;
  text-underline-offset: 3px;
  font-family: 'Jost', sans-serif;
}

.step-skip:hover { color: rgba(0,0,0,0.6);
}

var currentGamme = 'neo';
var selectedOptions = {};
var currentStep = -1;
var configStarted = false;

function getGammeFromURL() {
  var params = new URLSearchParams(window.location.search);
  var g = params.get('gamme');
  if (!GAMMES[g]) g = 'neo';
  return g;
}

function renderAll() {
  renderGameTabs();
  renderIntro();
  renderShowcase();
  renderSteps();
  renderProgressDots();
  updateSticky();
}

function renderGameTabs() {
  var tabsHtml = '';
  for (var key in GAMMES) {
    var active = (key === currentGamme) ? ' active' : '';
    tabsHtml += '<a class="gamme-tab' + active + '" onclick="switchGamme(\'' + key + '\', event)">' + GAMMES[key].name + '</a>';
  }
  document.getElementById('gamme-tabs').innerHTML = tabsHtml;
}

function renderIntro() {
  /* Intro is now just a hidden anchor — the showcase hero + CTA handle the presentation */
  document.getElementById('config-intro').innerHTML = '';
}

function renderShowcase() {
  var g = GAMMES[currentGamme];

  // Hero section
  var heroHtml = '<div class="showcase-hero-content">'
    + '<div class="showcase-hero-label">' + g.label + '</div>'
    + '<div class="showcase-hero-gamme">' + g.name + '</div>'
    + '<div class="showcase-hero-tagline">' + g.tagline + '</div>'
    + '<div class="showcase-hero-price">À partir de ' + g.basePrice.toLocaleString('fr-FR') + ' €</div>'
    + '<button class="showcase-hero-btn" onclick="scrollToConfig()">'
    + 'Configurer mon ' + g.name
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'
    + '</button>'
    + '</div>'
    + '<div class="showcase-hero-visual">' + SCENES.base + '</div>';
  document.getElementById('showcase-hero').innerHTML = heroHtml;

  // Showcase sections (4-5 key benefits)
  var sectionsHtml = '';
  var steps = g.steps;
  var numSections = Math.min(5, steps.length);

  for (var i = 0; i < numSections; i++) {
    var step = steps[i];
    var altClass = (i % 2 === 1) ? ' alt' : '';
    var sceneVisual = SCENES[step.scene] || SCENES.base;

    sectionsHtml += '<div class="showcase-section' + altClass + '">'
      + '<div class="showcase-section-content">'
      + '<div class="showcase-section-headline">' + step.headline.replace(/\n/g, '<br>') + '</div>'
      + '<div class="showcase-section-paragraph">' + step.benefit + '</div>'
      + '</div>'
      + '<div class="showcase-section-visual">' + sceneVisual + '</div>'
      + '</div>';
  }
  document.getElementById('showcase-sections').innerHTML = sectionsHtml;

  // Interactive preview
  var previewButtons = '';
  var previewFeatures = [
    { key: 'identity', label: 'Identité visuelle' },
    { key: 'animations', label: 'Animations' },
    { key: 'gallery', label: 'Galerie' },
    { key: 'analytics', label: 'Performance' }
  ];
  for (var i = 0; i < previewFeatures.length; i++) {
    var feat = previewFeatures[i];
    previewButtons += '<button class="showcase-interactive-btn' + (i === 0 ? ' active' : '') + '" onclick="switchPreview(\'' + feat.key + '\', event)">' + feat.label + '</button>';
  }

  var interactiveHtml = '<h2 class="showcase-interactive-title">Explorez les possibilités</h2>'
    + '<p class="showcase-interactive-desc">Cliquez sur une fonctionnalité pour voir un aperçu</p>'
    + '<div class="showcase-interactive-buttons">' + previewButtons + '</div>'
    + '<div class="showcase-interactive-preview" id="preview-visual">' + SCENES.identity + '</div>';
  document.getElementById('showcase-interactive').innerHTML = interactiveHtml;

  // CTA section
  var ctaHtml = '<h2 class="showcase-cta-headline">Prêt à commencer ?</h2>'
    + '<button class="showcase-cta-btn" onclick="scrollToConfig()">'
    + 'Personnaliser mon ' + g.name
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'
    + '</button>';

  attachShowcaseObservers();
}

function switchPreview(feature, evt) {
  evt.target.parentElement.querySelectorAll('.showcase-interactive-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });
  evt.target.classList.add('active');

  var visual = document.getElementById('preview-visual');
  visual.innerHTML = SCENES[feature] || SCENES.base;
}

function scrollToConfig() {
  var split = document.getElementById('config-split');
  startConfig();
  setTimeout(function() {
    split.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function switchGamme(key, evt) {
  evt.preventDefault();
  currentGamme = key;
  selectedOptions = {};
  currentStep = -1;
  configStarted = false;

  document.querySelectorAll('.gamme-tab').forEach(function(t) { t.classList.remove('active'); });
  evt.target.classList.add('active');

  renderAll();
  document.getElementById('config-split').classList.remove('visible');
  document.getElementById('sticky-bar').classList.remove('visible');
  document.getElementById('progress-dots').classList.remove('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSteps() {
  var g = GAMMES[currentGamme];
  var scenesHtml = '';

  scenesHtml += '<div class="visual-scene active" id="scene-base">' + SCENES.base + '</div>';

  for (var i = 0; i < g.steps.length; i++) {
    var sceneKey = g.steps[i].scene;
    scenesHtml += '<div class="visual-scene" id="scene-step-' + i + '">' + (SCENES[sceneKey] || SCENES.base) + '</div>';
  }
  document.getElementById('visual-container').innerHTML = scenesHtml;

  var stepsHtml = '';
  for (var i = 0; i < g.steps.length; i++) {
    var step = g.steps[i];
    var stepClass = (i === currentStep) ? ' active' : (i < currentStep ? ' completed' : (i === currentStep + 1 ? ' unlocked' : ''));
    var priceLabel = '';

    if (step.surDevis || step.price === null) {
      priceLabel = 'Sur devis';
    } else if (step.perMonth) {
      priceLabel = step.price + ' € / mois';
    } else if (step.perQuarter) {
      priceLabel = step.price + ' € / trimestre';
    } else if (step.type === 'qty') {
      priceLabel = step.price + ' € / ' + step.unit;
    } else {
      priceLabel = '+ ' + step.price + ' €';
    }

    stepsHtml += '<div class="config-step' + stepClass + '" data-step="' + i + '">'
      + '<div class="step-number">' + (i + 1) + '</div>'
      + '<h3 class="step-headline">' + step.headline + '</h3>'
      + '<p class="step-benefit">' + step.benefit + '</p>';

    if (step.type === 'toggle') {
      var selected = selectedOptions[step.id] ? ' selected' : '';
      stepsHtml += '<div class="choice-card' + selected + '" onclick="toggleOption(\'' + step.id + '\', ' + step.price + ')">'
        + '<div class="choice-label">'
        + '<div class="choice-title">Ajouter : ' + (step.optionName || 'cette option') + '</div>'
        + '<div class="choice-desc">' + (step.price ? (step.perMonth ? step.price + ' € / mois' : step.perQuarter ? step.price + ' € / trimestre' : 'À partir de ' + step.price + ' €') : 'Sur devis') + '</div>'
        + '</div>'
        + '<div class="choice-price">' + priceLabel + '</div>'
        + '<div class="choice-checkbox"></div>'
        + '</div>';
    } else if (step.type === 'qty') {
      var qty = selectedOptions[step.id] || 0;
      stepsHtml += '<div class="qty-wrap">'
        + '<div class="qty-price-label">' + step.price + ' € / ' + step.unit + '</div>'
        + '<div class="qty-control">'
        + '<button class="qty-btn" onclick="modifyQty(\'' + step.id + '\', ' + step.price + ', -1)">−</button>'
        + '<div class="qty-display">' + qty + ' <span class="qty-unit">' + step.unit + (qty !== 1 ? 's' : '') + '</span></div>'
        + '<button class="qty-btn" onclick="modifyQty(\'' + step.id + '\', ' + step.price + ', 1)">+</button>'
        + '</div>'
        + '</div>';
    }

    stepsHtml += '<div class="step-actions">'
      + '<button class="step-continue" onclick="advanceStep()">Continuer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>'
      + '<button class="step-skip" onclick="advanceStep()">Non merci, passer</button>'
      + '</div>';

    stepsHtml += '</div>';
  }
  document.getElementById('config-options').innerHTML = stepsHtml;
}

function startConfig() {
  if (!configStarted) {
    configStarted = true;
    document.getElementById('config-split').classList.add('visible');
    document.getElementById('sticky-bar').classList.add('visible');
    document.getElementById('progress-dots').classList.add('visible');

    var split = document.getElementById('config-split');
    split.scrollIntoView({ behavior: 'smooth', block: 'start' });
    currentStep = -1;
    advanceStep();
  }
}

function advanceStep() {
  var g = GAMMES[currentGamme];
  currentStep++;

  /* If past last step, open recap */
  if (currentStep >= g.steps.length) {
    currentStep = g.steps.length - 1;
    openRecap();
    return;
  }

  updateSteps();
  updateScene();
  updateSticky();

  /* Scroll to active step */
  var activeEl = document.querySelector('.config-step.active');
  if (activeEl) {
    setTimeout(function() {
      activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  }
}

function updateSteps() {
  var g = GAMMES[currentGamme];
  document.querySelectorAll('.config-step').forEach(function(el, i) {
    el.classList.remove('active', 'unlocked', 'completed');
    if (i === currentStep) {
      el.classList.add('active');
    } else if (i < currentStep) {
      el.classList.add('completed');
    } else if (i === currentStep + 1) {
      el.classList.add('unlocked');
    }
  });
}

function updateScene() {
  var g = GAMMES[currentGamme];
  document.querySelectorAll('.visual-scene').forEach(function(el) { el.classList.remove('active'); });
  var sceneId = currentStep === -1 ? 'scene-base' : 'scene-step-' + currentStep;
  var scene = document.getElementById(sceneId);
  if (scene) scene.classList.add('active');
}

function toggleOption(optionId, price) {
  if (selectedOptions[optionId]) {
    delete selectedOptions[optionId];
  } else {
    selectedOptions[optionId] = 1;
  }
  renderSteps();
  updateSticky();

  var step = -1;
  for (var i = 0; i < GAMMES[currentGamme].steps.length; i++) {
    if (GAMMES[currentGamme].steps[i].id === optionId) {
      step = i;
      break;
    }
  }
  if (step > currentStep) advanceStep();
}

function modifyQty(optionId, price, delta) {
  var current = selectedOptions[optionId] || 0;
  var g = GAMMES[currentGamme];
  var stepData = null;
  for (var i = 0; i < g.steps.length; i++) {
    if (g.steps[i].id === optionId) {
      stepData = g.steps[i];
      break;
    }
  }

  var newVal = Math.max(stepData.min || 0, Math.min(stepData.max || 999, current + delta));

  if (newVal > 0) {
    selectedOptions[optionId] = newVal;
  } else {
    delete selectedOptions[optionId];
  }

  renderSteps();
  updateSticky();
}

function calcPrice() {
  var g = GAMMES[currentGamme];
  var total = g.basePrice;
  var count = 0;

  for (var optionId in selectedOptions) {
    var val = selectedOptions[optionId];
    var stepData = null;
    for (var i = 0; i < g.steps.length; i++) {
      if (g.steps[i].id === optionId) {
        stepData = g.steps[i];
        break;
      }
    }
    if (stepData && stepData.price) {
      total += stepData.price * val;
      count += val;
    }
  }

  return {
    total: total,
    count: count,
    deposit: Math.round(total * 0.3)
  };
}

function updateSticky() {
  var g = GAMMES[currentGamme];
  var calc = calcPrice();

  document.getElementById('sticky-gamme-name').textContent = 'Site ' + g.name;
  document.getElementById('sticky-total').textContent = calc.total.toLocaleString('fr-FR') + ' €';

  var countText = calc.count === 0 ? 'Aucune option' : calc.count + ' option' + (calc.count > 1 ? 's' : '');
  document.getElementById('sticky-options-count').textContent = countText;

  document.getElementById('sticky-deposit').textContent = 'Acompte 30 % : ' + calc.deposit.toLocaleString('fr-FR') + ' €';
}

function openRecap() {
  var g = GAMMES[currentGamme];
  var calc = calcPrice();

  var items = [];
  items.push({ label: g.name + ' — ' + g.baseDesc, price: g.basePrice });

  for (var optionId in selectedOptions) {
    var val = selectedOptions[optionId];
    var stepData = null;
    var stepName = '';
    for (var i = 0; i < g.steps.length; i++) {
      if (g.steps[i].id === optionId) {
        stepData = g.steps[i];
        stepName = g.steps[i].headline.replace(/\n/g, ' ');
        break;
      }
    }
    if (stepData && stepData.price) {
      items.push({ label: stepName + ' (' + val + ')', price: stepData.price * val });
    }
  }

  var itemsHtml = '<div class="modal-section">'
    + '<div class="modal-label">Récapitulatif</div>';

  for (var i = 0; i < items.length; i++) {
    itemsHtml += '<div class="modal-item">'
      + '<span class="modal-item-label">' + items[i].label + '</span>'
      + '<span class="modal-item-price">' + items[i].price.toLocaleString('fr-FR') + ' €</span>'
      + '</div>';
  }

  itemsHtml += '</div>';

  var contentHtml = '<h2>Récapitulatif de votre projet</h2>'
    + itemsHtml
    + '<div class="modal-section">'
    + '<div class="modal-total">'
    + '<span>Total</span>'
    + '<span>' + calc.total.toLocaleString('fr-FR') + ' €</span>'
    + '</div>'
    + '<div class="modal-deposit">'
    + '<span>Acompte 30%</span>'
    + '<span>' + calc.deposit.toLocaleString('fr-FR') + ' €</span>'
    + '</div>'
    + '</div>'
    + '<p class="modal-vat">Facturé sans TVA (entreprise géorgienne, non assujettie). Clients professionnels dans l\'UE : autoliquidation.</p>'
    + '<div class="modal-fields">'
    +   '<input type="text" id="res-nom" placeholder="Nom et prénom" autocomplete="name">'
    +   '<input type="email" id="res-email" placeholder="Adresse e-mail" autocomplete="email">'
    +   '<input type="tel" id="res-tel" placeholder="Téléphone (facultatif)" autocomplete="tel">'
    + '</div>'
    + '<label class="modal-cgv"><input type="checkbox" id="cgv-ok" onchange="updateReserveBtn()"> <span>J\'ai lu et j\'accepte les <a href="cgv.html" target="_blank" rel="noopener">conditions générales de vente</a>.</span></label>'
    + '<label class="modal-cgv"><input type="checkbox" id="start-ok" onchange="updateReserveBtn()"> <span>Je demande expressément que la prestation démarre sans attendre. Si je commande en tant que particulier, je reconnais perdre mon <a href="cgv.html#a17" target="_blank" rel="noopener">droit de rétractation</a> une fois la prestation pleinement exécutée.</span></label>'
    + '<button class="btn-pay" onclick="reserveProject()" disabled>Réserver mon projet</button>'
    + '<p class="modal-next">Vous recevez sous 24 h ouvrées le devis définitif et la facture d\'acompte. Le projet démarre à réception de l\'acompte de 30 % par virement bancaire (IBAN européen). Aucun paiement n\'est demandé sur cette page.</p>';

  document.getElementById('modal-content').innerHTML = contentHtml;
  document.getElementById('modal-overlay').classList.add('visible');
}

function closeRecap() {
  document.getElementById('modal-overlay').classList.remove('visible');
}

function updateReserveBtn() {
  var a = document.getElementById('cgv-ok');
  var b = document.getElementById('start-ok');
  var btn = document.querySelector('.btn-pay');
  if (btn) btn.disabled = !(a && a.checked && b && b.checked);
}

function reserveProject() {
  var g = GAMMES[currentGamme];
  var calc = calcPrice();

  var items = [];
  items.push({ name: 'Site ' + g.name, price: g.basePrice, qty: 1 });

  for (var optionId in selectedOptions) {
    var val = selectedOptions[optionId];
    var stepData = null;
    var stepName = '';
    for (var i = 0; i < g.steps.length; i++) {
      if (g.steps[i].id === optionId) {
        stepData = g.steps[i];
        stepName = g.steps[i].optionName || g.steps[i].headline.replace(/\n/g, ' ');
        break;
      }
    }
    if (stepData && stepData.price) {
      items.push({ name: stepName, price: stepData.price, qty: val });
    }
  }

  var cgv = document.getElementById('cgv-ok');
  if (!cgv || !cgv.checked) { alert('Merci d\'accepter les conditions générales de vente avant de continuer.'); return; }
  var start = document.getElementById('start-ok');
  if (!start || !start.checked) { alert('Merci de confirmer la demande de démarrage de la prestation.'); return; }

  var elNom = document.getElementById('res-nom');
  var elMail = document.getElementById('res-email');
  var elTel = document.getElementById('res-tel');
  var nom = (elNom.value || '').trim();
  var email = (elMail.value || '').trim();
  var tel = (elTel.value || '').trim();
  if (!nom) { alert('Merci d\'indiquer votre nom.'); elNom.focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { alert('Merci d\'indiquer une adresse e-mail valide.'); elMail.focus(); return; }

  var detail = items.map(function (it) {
    return '- ' + it.name + (it.qty > 1 ? ' x' + it.qty : '') + ' : ' + (it.price * it.qty) + ' EUR';
  }).join('\n');

  var btn = document.querySelector('.btn-pay');
  var label = btn.textContent;
  btn.textContent = 'Envoi en cours...';
  btn.disabled = true;

  var data = {
    'form-name': 'reservation',
    'Nom': nom,
    'Email': email,
    'Telephone': tel,
    'Gamme': g.name,
    'Total': calc.total + ' EUR',
    'Acompte': calc.deposit + ' EUR',
    'Detail': detail,
    'CGV': 'acceptees',
    'Demarrage': 'demande expresse de demarrage immediat (renonciation retractation si consommateur)'
  };

  fetch('/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(data).toString()
  })
  .then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (typeof gtag === 'function') {
      gtag('event', 'reservation_projet', { gamme: g.name, value: calc.deposit, currency: 'EUR' });
    }
    window.location.href = 'merci.html';
  })
  .catch(function (err) {
    console.error(err);
    alert('L\'envoi n\'a pas abouti. Écrivez-nous à bassindigital@gmail.com : nous reprenons votre configuration.');
    btn.textContent = label;
    btn.disabled = false;
  });
}

function renderProgressDots() {
  var g = GAMMES[currentGamme];
  var dotsHtml = '';
  for (var i = 0; i < g.steps.length; i++) {
    var dotClass = (i === currentStep) ? ' active' : (i < currentStep ? ' done' : '');
    dotsHtml += '<div class="progress-dot' + dotClass + '" onclick="jumpToStep(' + i + ')"></div>';
  }
  document.getElementById('progress-dots').innerHTML = dotsHtml;
}

function jumpToStep(stepIdx) {
  currentStep = Math.max(-1, stepIdx - 1);
  advanceStep();
}

/* ═══════════════════════════════════════
   INTERSECTION OBSERVER FOR SCROLL ANIMATIONS
   ═══════════════════════════════════════ */
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

function attachShowcaseObservers() {
  document.querySelectorAll('.showcase-section').forEach(function(section) {
    observer.observe(section);
  });
}
